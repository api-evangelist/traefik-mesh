aid: traefik-mesh
name: Traefik Mesh
description: >-
  Traefik Mesh is a lightweight, non-invasive service mesh built on top of
  Traefik Proxy for Kubernetes. It provides automatic traffic management,
  observability, and security for microservices without requiring sidecar
  containers. Traefik Mesh is fully compliant with the Service Mesh Interface
  (SMI) specification and supports HTTP, TCP, and UDP traffic modes, traffic
  splitting, access control via TrafficTarget, rate limiting, circuit breaking,
  and retries.
